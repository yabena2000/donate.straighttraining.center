name: Update progress from ledger

# Every night, read the totals from the public construction ledger and
# commit data/progress.json if they changed. GitHub Pages then redeploys.
on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 04:30 in Zanzibar
  workflow_dispatch:         # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch numbers from the ledger
        run: python scripts/fetch_progress.py
      - name: Commit if changed
        run: |
          git add data/progress.json
          # fetchedAt changes on every run; only commit when the actual numbers changed
          if git diff --cached -U0 data/progress.json | grep -E '^[+-] ' | grep -vq '"fetchedAt"'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update progress from ledger"
            git push
          else
            echo "No change in the ledger numbers."
          fi
